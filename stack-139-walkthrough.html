const keymap={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d',w:'w',a:'a',s:'s',d:'d'};
addEventListener('keydown',e=>{if(overview)return;const k=e.key.toLowerCase();if(keymap[k]){e.preventDefault();keys.add(keymap[k])}if(k==='e'&&!e.repeat)interact()});
addEventListener('keyup',e=>keys.delete(keymap[e.key.toLowerCase()]));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-m]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.m)};b.onlostpointercapture=()=>keys.delete(b.dataset.m)});
let drag=null;
canvas.onpointerdown=e=>{if(drag)return;canvas.setPointerCapture(e.pointerId);drag=[e.pointerId,e.clientX,e.clientY]};
canvas.onlostpointercapture=()=>drag=null;
canvas.onpointermove=e=>{if(!drag||drag[0]!==e.pointerId)return;const dx=e.clientX-drag[1],dy=e.clientY-drag[2];drag=[e.pointerId,e.clientX,e.clientY];if(overview){orbit+=dx*.009;tilt=Math.max(.32,Math.min(1.45,tilt+dy*.009))}else{player.yaw-=dx*.007;player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch+dy*.007))}};
const map=$('map').getContext('2d'), mx=x=>8+(x-158)*.18,mz=z=>5+(z-95)*.176;
function drawMap(){
 map.clearRect(0,0,150,190);
 for(const [x,z,u,v,k] of floors){map.fillStyle=colors[k];map.fillRect(mx(x),mz(z),mx(u)-mx(x),mz(v)-mz(z))}
 map.strokeStyle='#efeade';map.lineWidth=2;
 for(const [x,z,u,v] of walls){map.beginPath();map.moveTo(mx(x),mz(z));map.lineTo(mx(u),mz(v));map.stroke()}
 map.fillStyle='#f6fbf7';map.font='bold 8px system-ui';map.textAlign='center';
 for(const [label,x,z] of [['KITCHEN',329,240],['BATH',386,490],['SHELTER',782,337],['LIVING',689,720],['BEDROOM',341,967]]){const [u,v]=planPoint([x,z]);map.fillText(label,mx(u),mz(v));}
 if(!overview){map.save();map.translate(mx(player.x/meter+180),mz(player.z/meter+90));map.rotate(-player.yaw);map.beginPath();map.moveTo(0,8);map.lineTo(-5,-4);map.lineTo(5,-4);map.closePath();map.fillStyle='#142b27';map.fill();map.strokeStyle='#c8ffdf';map.stroke();map.restore()}
}
let prev=0,lastView='', speedX=0, speedZ=0;
function frame(t){
 const dt=Math.min(.035,(t-prev)/1000);prev=t;
 if(!overview){
  const f=+keys.has('w')-keys.has('s'), r=+keys.has('d')-keys.has('a');
  const ease=1-Math.exp(-dt*16);
  speedX+=((Math.sin(player.yaw)*f+Math.cos(player.yaw)*r)/(Math.hypot(f,r)||1)-speedX)*ease;
  speedZ+=((Math.cos(player.yaw)*f-Math.sin(player.yaw)*r)/(Math.hypot(f,r)||1)-speedZ)*ease;
  const dx=Math.abs(speedX)>.005?speedX*1.48*dt:0,dz=Math.abs(speedZ)>.005?speedZ*1.48*dt:0;
  if(dx&&clear(player.x+dx,player.z))player.x+=dx;if(dz&&clear(player.x,player.z+dz))player.z+=dz;
  const near=nearest();$('use').classList.toggle('hide',!near);if(near){const label=(near.open?'Close ':'Open ')+near.name.toLowerCase();if($('use').textContent!==label)$('use').textContent=label}
 }else $('use').classList.add('hide');
 const ratio=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*ratio),h=Math.round(canvas.clientHeight*ratio);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
 const updated=dirty;
 if(dirty)build();
 const b=overview?basis(orbit,-tilt):basis(player.yaw,player.pitch);
 const target=[3.22,0,4.86],eye=overview?target.map((n,i)=>n-12*b[0][i]):[player.x,1.58,player.z];
 const zoom=Math.max(5,5.5*h/Math.max(w,1));
 const view=[w,h,...eye,...b[0]].join();
 if(flat&&(updated||view!==lastView))paint(w,h,eye,b,zoom);
 lastView=view;
 if(gl){gl.viewport(0,0,w,h);gl.clearColor(...(overview?[.16,.21,.24]:[.55,.69,.72]),1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 for(const [k,value] of Object.entries({eye,front:b[0],right:b[1],up:b[2]}))gl.uniform3fv(uniforms[k],value);
 gl.uniform1f(uniforms.aspect,w/Math.max(h,1));gl.uniform1f(uniforms.ortho,+overview);gl.uniform1f(uniforms.zoom,zoom);
 gl.drawArrays(gl.TRIANGLES,0,count);}drawMap();requestAnimationFrame(frame);
}
jump(rooms[1]);
player.pitch=-.15;
requestAnimationFrame(frame);
</script></html>
