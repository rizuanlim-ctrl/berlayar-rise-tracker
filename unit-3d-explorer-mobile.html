<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 3D Explorer · Berlayar Rise</title>
<style>
:root{font-family:Manrope,Arial,sans-serif;color:#173b29;background:#f4f7f3;color-scheme:light}
@font-face{font-family:Manrope;src:url('/manrope-400.woff')}
@font-face{font-family:Manrope;src:url('/manrope-700.woff');font-weight:700}
*{box-sizing:border-box}body{margin:0}
header{background:#e8f0e9;border-bottom:1px solid #a3bbaa;padding:12px max(12px,calc((100vw - 1480px)/2));display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{font-size:clamp(20px,4vw,29px);margin:0;font-weight:700}
a{color:inherit}
.back{display:inline-flex;align-items:center;min-height:44px;border:1px solid #759680;border-radius:9px;padding:6px 10px;text-decoration:none;background:white;font-weight:700}
main{max-width:1500px;margin:auto;padding:16px}
.toolbar{background:#eaf2ec;border:1px solid #a5baa9;border-radius:13px;padding:15px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
label{display:grid;gap:5px;font-weight:700;font-size:13px}
select,input{width:100%;min-width:0;min-height:44px;border:1px solid #76927e;border-radius:9px;padding:8px 10px;font:inherit;font-size:15px;background:white;color:#173b29}
select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #bf7d30;outline-offset:2px}
.viewer{margin-top:12px;border:1px solid #a3baa9;border-radius:13px;overflow:hidden;background:#17191b}
iframe{display:block;width:100%;height:clamp(570px,80dvh,920px);border:0}
.note{font-size:12px;color:#4b6552;margin:10px 2px;line-height:1.55}
@media(max-width:700px){header{padding:8px 10px}main{padding:8px}.toolbar{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px;padding:8px}.viewer{margin-top:8px}iframe{height:max(560px,70dvh)}.back{font-size:13px}}
@media(max-width:390px){.toolbar{grid-template-columns:1fr 1fr}label{font-size:12px}select,input{font-size:13px;padding:6px}}
</style>
<link rel="stylesheet" href="/assets/unit-explorer-actions.css?v=1">
</head>
<body>
<header><h1>Unit 3D Explorer</h1><a class="back" aria-label="Back to tracker" href="/">← Tracker</a></header>
<main>
<section class="toolbar" aria-label="Unit selection">
<label>Room type<select id="room"><option value="type1">2-Room Flexi Type 1</option><option value="type2" selected>2-Room Flexi Type 2</option><option value="three">3-Room</option><option value="four">4-Room</option></select></label>
<label>Block<select id="block"></select></label>
<label>Stack<select id="stack"></select></label>
<label>Floor<select id="floor" aria-label="Available floor for selected unit"></select></label>
</section>
<section class="viewer" aria-label="Interactive 3D unit walkthrough"><iframe id="tour" title="Interactive interior walkthrough" allow="fullscreen" loading="eager"></iframe></section>
<p class="note">The interior, furnishings and external outlook are illustrative and may differ from the completed development. Use the HDB floor plans and official information to verify unit details. This is the same interactive walkthrough engine available in Unit Explorer Details.</p>
</main>
<script type="module" src="/assets/unit-explorer-viewer.js?v=1"></script>
</body></html>
