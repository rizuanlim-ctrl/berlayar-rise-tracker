<!doctype html><html><head><title>Export verification fixture</title></head><body><h1>Export verification fixture</h1><p>Test data only. Does not save changes to the tracker.</p><button class="export-excel" id="test">Generate test workbook</button><p id="result"></p><div id="root"></div><script type="module">import {i,n} from '/assets/tracker-combined-export-v1.js';import {downloadWorkbook} from '/assets/combined-export-v1.js';document.getElementById('test').onclick=async()=>{try{const live=await fetch('https://berlayar-rise-tracker.rizuanlim.chatgpt.site/api/tracker').then(r=>r.json());const state=structuredClone(live.state);state.overrides={};const a=i.filter(u=>u.room==='2R').slice(0,2);state.overrides[a[0].id]={status:'Taken',ethnicity:'Malay'};state.overrides[a[1].id]={status:'Taken',ethnicity:''};await downloadWorkbook(state,n(state));document.getElementById('result').textContent='Test workbook ready: two taken units, one Malay, one missing ethnicity';}catch(e){document.getElementById('result').textContent=e.stack;}};</script></body></html>
